<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <!-- Firebase SDK: 동적 로드 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간 블록 스케줄러</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap');

  :root {
    --bg:        #F0F2F5;
    --surface:   #FFFFFF;
    --border:    #DDE1E9;
    --border-hr: #C8CDD8;
    --text:      #1A1D27;
    --text-sub:  #6B7280;
    --text-hint: #9CA3AF;
    --today:     #1D4ED8;
    --today-bg:  #EFF6FF;
    --sat:       #2563EB;
    --sun:       #DC2626;
    --px: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ──────────────────────────────────── */
  .topbar {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    flex-shrink: 0;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px 8px;
    border-bottom: 1px solid var(--border);
  }
  .title-row h1 { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: -.3px; }
  .runtime-legend { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  .rt-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-sub); }
  .rt-dot  { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  .cat-row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 20px; flex-wrap: wrap;
  }
  .cat-label { font-size: 11px; font-weight: 600; color: var(--text-sub); letter-spacing: .3px; margin-right: 4px; flex-shrink: 0; }
  .cat-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 6px; border-radius: 20px;
    font-size: 11px; font-weight: 600; color: #fff; letter-spacing: .2px; white-space: nowrap;
  }
  .cat-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); flex-shrink: 0; }

  /* ── Body ────────────────────────────────────── */
  .body { display: flex; flex: 1; overflow: hidden; }

  /* ── Time axis ───────────────────────────────── */
  .taxis { width: 52px; flex-shrink: 0; background: var(--surface); border-right: 1.5px solid var(--border); overflow: hidden; position: relative; }
  .taxis-inner { position: absolute; left: 0; right: 0; top: 0; }
  .tlbl { font-size: 11px; font-weight: 500; color: var(--text-sub); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px 8px 0 0; line-height: 1; }

  /* ── Grid scroll ─────────────────────────────── */
  .gscroll { flex: 1; overflow: auto; background: var(--bg); }
  .gscroll::-webkit-scrollbar { width: 7px; height: 7px; }
  .gscroll::-webkit-scrollbar-track { background: transparent; }
  .gscroll::-webkit-scrollbar-thumb { background: var(--border-hr); border-radius: 4px; }
  .gwrap { position: relative; min-width: 560px; }

  /* ── Day headers (buttons) ───────────────────── */
  .dhdrs {
    display: grid; grid-template-columns: repeat(7, minmax(0,1fr));
    position: sticky; top: 0; z-index: 30;
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.05);
  }
  .dhdr {
    border-right: 1px solid var(--border);
    text-align: center; padding: 0;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    background: none; border-top: none; border-bottom: none; border-left: none;
    cursor: pointer;
    color: var(--text-sub);
    transition: background .12s, color .12s;
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 7px 4px;
  }
  .dhdr:hover { background: var(--bg); }
  .dhdr:last-child { border-right: none; }
  .dhdr .day-name { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .dhdr .day-dot  { width: 5px; height: 5px; border-radius: 50%; background: transparent; transition: background .12s; }
  .dhdr:hover .day-dot { background: var(--border-hr); }

  .dhdr.today   { color: var(--today); background: var(--today-bg); }
  .dhdr.sat     { color: var(--sat); }
  .dhdr.sun     { color: var(--sun); }
  .dhdr.today.sat { color: var(--sat); background: #EFF6FF; }
  .dhdr.today.sun { color: var(--sun); background: #FEF2F2; }

  /* ── Column grid ─────────────────────────────── */
  .gcols { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); position: relative; background: var(--surface); }
  .dcol  { border-right: 1px solid var(--border); position: relative; background: var(--surface); }
  .dcol:last-child { border-right: none; }
  .dcol.weekend { background: rgba(248,250,255,.6); }
  .dcol.today-col { background: rgba(134,239,172,.35) !important; }  /* 오늘 열: 옅은 초록 */
  .dcol.today-col.weekend { background: rgba(134,239,172,.4) !important; }
  /* 블록 위에 항상 보이는 시간 격자선 오버레이 */
  .dcol::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 25;
    background-image: var(--grid-overlay);
  }

  .sl { position: absolute; left: 0; right: 0; cursor: pointer; transition: background .08s; }
  .sl:hover { background: rgba(0,0,0,.03); }

  .sinp-w { position: absolute; inset: 2px; z-index: 50; display: none; }
  .sinp-w.on { display: flex; }
  .sinp { width: 100%; height: 100%; border: 2px solid var(--today); border-radius: 5px; background: #fff; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; padding: 0 6px; color: var(--text); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }

  /* ── Block ───────────────────────────────────── */
  .blk { position: absolute; left: 3px; right: 3px; border-radius: 6px; cursor: grab; user-select: none; z-index: 20; overflow: hidden; display: flex; flex-direction: column; padding: 4px 7px; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: box-shadow .12s; min-height: 4px; }
  .blk:hover { box-shadow: 0 4px 12px rgba(0,0,0,.22); }
  .blk.dg { cursor: grabbing; opacity: .85; z-index: 200; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  /* 블록 라벨: 블록 크기와 무관하게 항상 블록 위에 표시 */
  .blk-lbl {
    position: absolute;
    left: 6px; top: 50%; transform: translateY(-50%);
    right: 22px;
    font-size: 10px; font-weight: 700; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
    pointer-events: none;
    z-index: 1;
  }
  .blk-dur { display: none; }

  /* 완료된 블록 */
  .blk.done { opacity: .55; }
  .blk.done .blk-lbl { text-decoration: line-through; }
  .blk-check {
    position: absolute; top: 50%; left: 5px; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.15);
    cursor: pointer; display: none; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; z-index: 40; padding: 0; line-height: 1;
  }
  .blk:hover .blk-check { display: flex; }
  .blk.done .blk-check { display: flex; background: rgba(255,255,255,.9); color: #16A34A; border-color: #fff; }
  .blk.done .blk-lbl { padding-left: 20px; }
  .blk:hover .blk-lbl { padding-left: 20px; }

  /* 현재 시각 선 */
  .now-line {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px solid #EF4444; z-index: 45; pointer-events: none;
  }
  .now-line::before {
    content: ''; position: absolute; left: -4px; top: -5px;
    width: 8px; height: 8px; border-radius: 50%; background: #EF4444;
  }
  .now-label {
    position: absolute; left: 2px; top: -16px;
    font-size: 9px; font-weight: 700; color: #EF4444;
    background: var(--surface); padding: 0 3px; border-radius: 3px;
    pointer-events: none; z-index: 46;
  }

  /* 드래그 생성 프리뷰 */
  .drag-create-preview {
    position: absolute; left: 3px; right: 3px;
    background: rgba(29,78,216,.25); border: 1.5px dashed #1D4ED8;
    border-radius: 6px; z-index: 60; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #1D4ED8;
  }
  .blk-del { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.38); border: none; cursor: pointer; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; padding: 0; line-height: 1; z-index: 50; flex-shrink: 0; display: none; }
  .blk:hover .blk-del { display: flex; }
  .blk-del:hover { background: rgba(200,0,0,.8); }

  /* ── Zoom controls ──────────────────────────────*/
  .zoom-controls {
    display: flex; align-items: center; gap: 4px; margin-left: 12px;
  }
  .zoom-btn {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; font-size: 15px; color: var(--text-sub);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; transition: background .1s; line-height: 1;
    font-family: monospace;
  }
  .zoom-btn:hover { background: var(--border); }
  .zoom-pct {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    min-width: 36px; text-align: center;
  }

  /* ── Save bar ────────────────────────────────── */
  .savebar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .week-label {
    font-size: 12px; font-weight: 600; color: var(--text-sub);
    margin-right: 4px; white-space: nowrap;
  }
  .week-nav {
    display: flex; align-items: center; gap: 2px;
  }
  .week-nav button {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; font-size: 13px; color: var(--text-sub);
    display: flex; align-items: center; justify-content: center;
    transition: background .1s;
  }
  .week-nav button:hover { background: var(--border); }
  .week-tag {
    font-size: 11px; font-weight: 600; color: var(--text);
    padding: 3px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    min-width: 120px; text-align: center; white-space: nowrap;
    cursor: pointer; transition: border-color .12s;
  }
  .week-tag:hover { border-color: #1D4ED8; color: #1D4ED8; }

  /* ── Date search ─────────────────────────────── */
  .date-search-wrap {
    position: relative; display: flex; align-items: center; gap: 0;
  }
  .date-search-input {
    height: 28px; padding: 0 8px;
    border: 1px solid var(--border); border-right: none;
    border-radius: 7px 0 0 7px;
    font-size: 11px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); background: var(--surface); outline: none;
    width: 120px; transition: border-color .12s;
  }
  .date-search-input:focus { border-color: #1D4ED8; }
  .date-search-btn {
    height: 28px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 0 7px 7px 0;
    background: var(--bg); cursor: pointer;
    font-size: 12px; color: var(--text-sub);
    transition: background .1s; display: flex; align-items: center;
  }
  .date-search-btn:hover { background: var(--border); }
  .date-search-clear {
    position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--text-hint); cursor: pointer;
    background: none; border: none; padding: 0 4px; display: none;
  }
  .date-search-clear.show { display: block; }
  .savebar-actions { display: flex; gap: 6px; margin-left: auto; }
  .btn-save, .btn-export, .btn-import, .btn-archive {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background .1s, border-color .1s;
    white-space: nowrap;
  }
  .btn-save   { background: #1D4ED8; color: #fff; border-color: #1D4ED8; }
  .btn-save:hover { background: #1E40AF; }
  .btn-export { background: var(--bg); color: var(--text-sub); }
  .btn-export:hover { background: var(--border); }
  .btn-import { background: var(--bg); color: var(--text-sub); }
  .btn-import:hover { background: var(--border); }

  /* ── Weekly stats modal ─────────────────────── */
  .wstat-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(15,20,35,.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .wstat-overlay.show { opacity: 1; pointer-events: all; }
  .wstat-panel {
    background: var(--surface); border-radius: 14px;
    width: 560px; max-width: 96vw; max-height: 85vh;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
    transform: translateY(12px) scale(.97); transition: transform .18s;
  }
  .wstat-overlay.show .wstat-panel { transform: translateY(0) scale(1); }
  .wstat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px 13px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .wstat-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .wstat-sub   { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .wstat-body  { overflow-y: auto; flex: 1; padding: 16px 20px 20px; }
  .wstat-body::-webkit-scrollbar { width: 5px; }
  .wstat-body::-webkit-scrollbar-thumb { background: var(--border-hr); border-radius: 3px; }

  /* summary cards row */
  .wstat-cards {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px;
  }
  .wstat-card {
    background: var(--bg); border-radius: 10px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .wstat-card-label { font-size: 10px; font-weight: 600; color: var(--text-hint); letter-spacing: .5px; }
  .wstat-card-val   { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .wstat-card-sub   { font-size: 10px; color: var(--text-hint); }

  /* big stacked bar */
  .wstat-bar-wrap { margin-bottom: 16px; }
  .wstat-bar-label { font-size: 10px; font-weight: 600; color: var(--text-hint); letter-spacing: .5px; margin-bottom: 6px; }
  .wstat-stack {
    height: 14px; border-radius: 7px; overflow: hidden;
    display: flex; gap: 2px; background: var(--bg);
  }
  .wstat-seg { height: 100%; border-radius: 4px; min-width: 3px; }

  /* day breakdown table */
  .wstat-days-title { font-size: 10px; font-weight: 600; color: var(--text-hint); letter-spacing: .5px; margin-bottom: 8px; margin-top: 4px; }
  .wstat-day-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--bg);
  }
  .wstat-day-row:last-child { border-bottom: none; }
  .wstat-day-name { font-size: 12px; font-weight: 700; color: var(--text-sub); width: 36px; flex-shrink: 0; letter-spacing: .5px; }
  .wstat-day-name.sat { color: var(--sat); }
  .wstat-day-name.sun { color: var(--sun); }
  .wstat-day-bar-wrap { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; display: flex; gap: 1px; }
  .wstat-day-seg { height: 100%; border-radius: 2px; }
  .wstat-day-time { font-size: 11px; font-weight: 600; color: var(--text); min-width: 60px; text-align: right; flex-shrink: 0; }
  .wstat-day-pct  { font-size: 10px; color: var(--text-hint); min-width: 34px; text-align: right; flex-shrink: 0; }

  /* category section */
  .wstat-cat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;
  }
  .wstat-cat-card {
    background: var(--bg); border-radius: 8px; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .wstat-cat-dot  { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .wstat-cat-info { flex: 1; min-width: 0; }
  .wstat-cat-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .wstat-cat-time { font-size: 11px; color: var(--text-hint); margin-top: 1px; }
  .wstat-cat-pct  { font-size: 12px; font-weight: 700; color: var(--text-sub); flex-shrink: 0; }

  /* archive panel */
  .archive-overlay {
    position: fixed; inset: 0; z-index: 998;
    background: rgba(15,20,35,.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .archive-overlay.show { opacity: 1; pointer-events: all; }
  .archive-panel {
    background: var(--surface); border-radius: 14px;
    width: 420px; max-width: 94vw; max-height: 75vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
    transform: translateY(12px) scale(.97); transition: transform .18s;
  }
  .archive-overlay.show .archive-panel { transform: translateY(0) scale(1); }
  .archive-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px 13px; border-bottom: 1px solid var(--border);
  }
  .archive-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .archive-body  { overflow-y: auto; flex: 1; padding: 12px 16px; }
  .archive-body::-webkit-scrollbar { width: 5px; }
  .archive-body::-webkit-scrollbar-thumb { background: var(--border-hr); border-radius: 3px; }
  .arc-empty { text-align: center; padding: 32px; color: var(--text-hint); font-size: 13px; }
  .arc-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 8px;
    cursor: pointer; transition: background .1s;
  }
  .arc-item:hover { background: var(--bg); }
  .arc-item-info { flex: 1; min-width: 0; }
  .arc-item-week { font-size: 13px; font-weight: 600; color: var(--text); }
  .arc-item-meta { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .arc-item-load {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); font-size: 11px; font-weight: 600;
    color: var(--text-sub); cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    white-space: nowrap;
  }
  .arc-item-load:hover { background: var(--border); }
  .arc-item-del {
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: none; cursor: pointer; font-size: 14px; color: var(--text-hint);
    display: flex; align-items: center; justify-content: center;
  }
  .arc-item-del:hover { background: #FEE2E2; color: var(--sun); }

  /* toast */
  .toast {
    position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: #1A1D27; color: #fff; font-size: 12px; font-weight: 500;
    padding: 8px 18px; border-radius: 20px; z-index: 9999;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 로그인 오버레이 ─────────────────────────── */
  .login-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #1D4ED8 0%, #7C3AED 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
  }
  .login-box {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 36px 40px;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    max-width: 340px; width: 90%;
  }
  .login-icon  { font-size: 48px; }
  .login-title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; }
  .login-desc  { font-size: 13px; color: rgba(255,255,255,.75); text-align: center; line-height: 1.6; }
  .login-btn {
    display: flex; align-items: center; gap: 10px;
    background: #fff; color: #1A1D27;
    border: none; border-radius: 10px;
    padding: 12px 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    width: 100%; justify-content: center;
    transition: opacity .15s;
    box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  .login-btn:hover { opacity: .9; }
  .login-btn img { width: 20px; height: 20px; }

  /* 유저 정보 (헤더) */
  .user-info {
    display: none; align-items: center; gap: 8px;
    margin-left: auto;
  }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    object-fit: cover; border: 1.5px solid var(--border);
  }
  .user-name { font-size: 12px; font-weight: 600; color: var(--text-sub); }
  .logout-btn {
    font-size: 11px; color: var(--text-hint);
    background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .logout-btn:hover { color: var(--sun); border-color: #FECACA; }

  /* ── View toggle ────────────────────────────── */
  .view-toggle {
    display: flex; align-items: center; gap: 0;
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; flex-shrink: 0;
  }
  .view-btn {
    padding: 5px 14px; font-size: 11px; font-weight: 600;
    border: none; background: var(--bg); color: var(--text-sub);
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    transition: background .12s, color .12s;
    white-space: nowrap;
  }
  .view-btn.active { background: #1D4ED8; color: #fff; }
  .view-btn:first-child { border-right: 1px solid var(--border); }

  /* day-view navigator */
  .day-nav-bar {
    display: none; align-items: center; gap: 8px;
    padding: 0 8px;
  }
  .day-nav-bar.show { display: flex; }
  .day-nav-btn {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; font-size: 14px; color: var(--text-sub);
    display: flex; align-items: center; justify-content: center;
    transition: background .1s;
  }
  .day-nav-btn:hover { background: var(--border); }
  .day-nav-label {
    font-size: 13px; font-weight: 700; color: var(--text);
    min-width: 90px; text-align: center; letter-spacing: .5px;
  }
  .day-nav-label.sat { color: var(--sat); }
  .day-nav-label.sun { color: var(--sun); }

  /* single-column mode: gcols shows 1 col, fills full width */
  .gcols.day-view { grid-template-columns: minmax(0, 1fr); width: 100%; }
  .dhdrs.day-view { grid-template-columns: minmax(0, 1fr); width: 100%; }
  .gcols.day-view .dcol { width: 100%; min-width: 0; }
  /* day-view: gwrap도 최소 너비 제한 해제 */
  .gscroll.day-view-scroll .gwrap { min-width: 0; width: 100%; }

  /* ── Day-view layout: schedule(1) + memo(4) ─────────── */
  .day-layout {
    display: flex; flex: 1; overflow: hidden;
  }
  .day-schedule-wrap {
    display: flex; flex: 2; overflow: hidden; min-width: 0;
  }
  .memo-panel {
    flex: 5; min-width: 0;
    background: var(--bg);
    border-left: 1.5px solid var(--border);
    display: none; flex-direction: column;
    overflow: hidden;
  }
  /* PC: 메모패널 show */
  @media (min-width: 769px) {
    .memo-panel.show { display: flex; }
  }

  /* memo header */
  .memo-head {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .memo-head-title { font-size: 12px; font-weight: 700; color: var(--text-sub); letter-spacing: .4px; }
  .memo-head-day   { font-size: 12px; font-weight: 700; color: var(--text); }
  .memo-head-day.sat { color: var(--sat); }
  .memo-head-day.sun { color: var(--sun); }
  .memo-add-btn {
    margin-left: auto;
    height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text-sub);
    display: flex; align-items: center; gap: 4px;
    transition: background .1s;
  }
  .memo-add-btn:hover { background: var(--border); }
  .memo-clear-btn {
    height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border); background: none;
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text-hint);
    transition: background .1s;
  }
  .memo-clear-btn:hover { background: #FEE2E2; color: var(--sun); border-color: #FECACA; }

  /* memo scroll area */
  .memo-scroll {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .memo-scroll::-webkit-scrollbar { width: 5px; }
  .memo-scroll::-webkit-scrollbar-thumb { background: var(--border-hr); border-radius: 3px; }

  /* memo block */
  .memo-block {
    background: var(--surface); border-radius: 10px;
    border: 1.5px solid var(--border);
    display: flex; flex-direction: column;
    transition: border-color .12s, box-shadow .12s;
    overflow: hidden;
  }
  .memo-block:focus-within {
    border-color: #1D4ED8;
    box-shadow: 0 0 0 3px rgba(29,78,216,.1);
  }
  .memo-block-header {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px 5px; border-bottom: 1px solid var(--bg);
  }
  .memo-block-color {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
    border: 1.5px solid rgba(0,0,0,.12);
  }
  .memo-block-title {
    flex: 1; border: none; outline: none; font-size: 12px; font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif; color: var(--text);
    background: transparent; min-width: 0;
  }
  .memo-block-title::placeholder { color: var(--text-hint); }
  .memo-block-del {
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: none; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 13px; color: var(--text-hint);
    flex-shrink: 0; transition: background .1s;
  }
  .memo-block-del:hover { background: #FEE2E2; color: var(--sun); }
  .memo-block-body {
    padding: 8px 10px; min-height: 60px;
    font-size: 13px; line-height: 1.7; color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    border: none; outline: none; resize: none; width: 100%;
    background: transparent;
  }
  .memo-block-body::placeholder { color: var(--text-hint); font-size: 12px; }
  .memo-block-footer {
    padding: 4px 10px 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .memo-block-time { font-size: 10px; color: var(--text-hint); }
  .memo-block-saved { font-size: 10px; color: #16A34A; opacity: 0; transition: opacity .3s; }
  .memo-block-saved.show { opacity: 1; }

  /* color picker popup */
  .memo-color-picker {
    position: absolute; z-index: 200;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
    display: flex; gap: 6px; flex-wrap: wrap; width: 124px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .memo-color-picker .cp-dot {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color .1s, transform .1s;
  }
  .memo-color-picker .cp-dot:hover { transform: scale(1.2); }
  .memo-color-picker .cp-dot.sel { border-color: var(--text); }

  /* empty state */
  .memo-empty {
    text-align: center; padding: 48px 20px;
    color: var(--text-hint); font-size: 13px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .memo-empty-icon { font-size: 32px; }

  /* ── Template modal ──────────────────────────── */
  .tpl-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(15,20,35,.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .tpl-overlay.show { opacity: 1; pointer-events: all; }
  .tpl-panel {
    background: var(--surface); border-radius: 14px;
    width: 480px; max-width: 96vw; max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
    transform: translateY(12px) scale(.97); transition: transform .18s;
    overflow: hidden;
  }
  .tpl-overlay.show .tpl-panel { transform: translateY(0) scale(1); }
  .tpl-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px 13px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .tpl-head-left { display: flex; flex-direction: column; gap: 2px; }
  .tpl-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .tpl-sub   { font-size: 11px; color: var(--text-hint); }
  .tpl-body  { overflow-y: auto; flex: 1; padding: 14px 16px; }
  .tpl-body::-webkit-scrollbar { width: 5px; }
  .tpl-body::-webkit-scrollbar-thumb { background: var(--border-hr); border-radius: 3px; }

  /* save-as bar */
  .tpl-saveas {
    display: flex; gap: 8px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    background: var(--bg);
  }
  .tpl-name-input {
    flex: 1; height: 32px; border: 1.5px solid var(--border); border-radius: 7px;
    padding: 0 10px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); background: var(--surface); outline: none;
  }
  .tpl-name-input:focus { border-color: #1D4ED8; box-shadow: 0 0 0 2px rgba(29,78,216,.12); }
  .tpl-save-btn {
    height: 32px; padding: 0 14px; border-radius: 7px;
    border: none; background: #1D4ED8; color: #fff;
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; white-space: nowrap;
  }
  .tpl-save-btn:hover { background: #1E40AF; }

  /* empty state */
  .tpl-empty {
    text-align: center; padding: 36px 20px; color: var(--text-hint); font-size: 13px;
  }
  .tpl-empty-icon { font-size: 32px; margin-bottom: 10px; }

  /* template item */
  .tpl-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--border); margin-bottom: 8px;
    background: var(--surface); transition: border-color .12s;
  }
  .tpl-item:hover { border-color: #1D4ED8; }
  .tpl-item-icon { font-size: 20px; flex-shrink: 0; }
  .tpl-item-info { flex: 1; min-width: 0; }
  .tpl-item-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .tpl-item-name-input {
    font-size: 13px; font-weight: 600; color: var(--text);
    border: 1.5px solid #1D4ED8; border-radius: 5px;
    padding: 1px 6px; font-family: 'Noto Sans KR', sans-serif;
    outline: none; background: var(--surface); width: 180px;
  }
  .tpl-item-meta { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .tpl-chip-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .tpl-chip {
    font-size: 10px; font-weight: 600; color: #fff;
    padding: 2px 7px; border-radius: 10px; white-space: nowrap;
  }
  .tpl-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .tpl-btn {
    height: 28px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; white-space: nowrap;
    color: var(--text-sub); transition: background .1s;
  }
  .tpl-btn:hover { background: var(--border); }
  .tpl-btn.primary { background: #1D4ED8; color: #fff; border-color: #1D4ED8; }
  .tpl-btn.primary:hover { background: #1E40AF; }
  .tpl-btn.danger  { color: var(--sun); }
  .tpl-btn.danger:hover { background: #FEE2E2; border-color: #FECACA; }

  /* apply-mode selector in item */
  .tpl-apply-mode {
    display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    margin-top: 6px;
  }
  .tpl-mode-btn {
    flex: 1; padding: 4px 0; font-size: 10px; font-weight: 600;
    border: none; background: var(--bg); color: var(--text-hint);
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    transition: background .1s;
  }
  .tpl-mode-btn.sel { background: #1D4ED8; color: #fff; }

  /* ── Tip bar ─────────────────────────────────── */
  .tip { padding: 6px 20px; font-size: 11px; color: var(--text-hint); background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; text-align: center; }
  .tip strong { color: var(--text-sub); font-weight: 600; }

  /* ── Modal overlay ───────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(15,20,35,.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    width: 380px;
    max-width: 94vw;
    max-height: 80vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.22), 0 4px 16px rgba(0,0,0,.12);
    transform: translateY(12px) scale(.97);
    transition: transform .18s;
  }
  .modal-overlay.show .modal { transform: translateY(0) scale(1); }

  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .modal-sub   { font-size: 12px; color: var(--text-hint); margin-top: 2px; }
  .modal-close {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-sub);
    transition: background .1s;
  }
  .modal-close:hover { background: var(--border); }

  .modal-body { overflow-y: auto; padding: 16px 20px 20px; flex: 1; }
  .modal-body::-webkit-scrollbar { width: 5px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border-hr); border-radius: 3px; }

  /* total bar */
  .total-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); border-radius: 8px; padding: 10px 14px;
    margin-bottom: 14px;
  }
  .total-label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
  .total-val   { font-size: 13px; font-weight: 600; color: var(--text); }

  /* stacked bar */
  .stack-bar {
    height: 10px; border-radius: 5px; overflow: hidden;
    display: flex; margin-bottom: 16px; gap: 2px;
  }
  .stack-seg { height: 100%; border-radius: 3px; transition: flex .3s; min-width: 2px; }

  /* category rows */
  .cat-section-title { font-size: 10px; font-weight: 600; color: var(--text-hint); letter-spacing: .8px; margin-bottom: 8px; }

  .stat-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--bg);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .stat-name  { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
  .stat-bar-wrap { width: 100px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
  .stat-time  { font-size: 12px; font-weight: 600; color: var(--text); min-width: 44px; text-align: right; flex-shrink: 0; }
  .stat-pct   { font-size: 11px; color: var(--text-hint); min-width: 36px; text-align: right; flex-shrink: 0; }

  /* free time */
  .free-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #F8FAFB; border-radius: 8px;
    margin-top: 12px;
  }
  .free-icon { font-size: 18px; }
  .free-label { font-size: 13px; color: var(--text-sub); flex: 1; }
  .free-time  { font-size: 13px; font-weight: 600; color: var(--text-sub); }

  /* ════════════════════════════════════════════
     RESPONSIVE — 모바일 (max-width: 768px)
     ════════════════════════════════════════════ */
  @media (max-width: 768px) {

    /* 전체 레이아웃 */
    #app, body {
      height: 100dvh;   /* iOS 주소창 고려 */
    }

    /* 상단 topbar: 카테고리 줄 숨김 */
    .cat-row { display: none; }
    .title-row {
      padding: 8px 12px 6px;
    }
    .title-row h1 { font-size: 14px; }
    #fbStatus { display: none; }

    /* 시간축 좁게 */
    .taxis { width: 36px; }
    .tlbl  { font-size: 9px; padding: 2px 4px 0 0; }

    /* 그리드 최소 너비 줄이기 */
    .gwrap { min-width: 0 !important; }

    /* 하단 savebar: 두 줄로 */
    .savebar {
      flex-wrap: wrap;
      padding: 6px 10px;
      gap: 6px;
    }

    /* 날짜 검색 숨김 (모바일에서 공간 부족) */
    .date-search-wrap { display: none; }

    /* WEEK 레이블 숨김 */
    .week-label { display: none; }

    /* week-tag 작게 */
    .week-tag {
      font-size: 10px;
      min-width: 80px;
      padding: 2px 6px;
    }

    /* 줌 버튼 숨김 (pinch-zoom 사용) */
    .zoom-controls { display: none; }

    /* 버튼 작게 */
    .btn-save, .btn-export, .btn-import, .view-btn {
      font-size: 10px;
      padding: 4px 8px;
      height: auto;
    }

    /* savebar-actions 줄바꿈 */
    .savebar-actions {
      flex-wrap: wrap;
      gap: 4px;
    }

    /* 내보내기/불러오기/기록 숨김 → 더보기 버튼으로 */
    #btnExport, #btnImport, #btnArchive, #btnWeekStats, #btnTemplate {
      display: none;
    }

    /* 모바일 더보기 버튼 표시 */
    #btnMore { display: flex !important; }

    /* 블록 라벨 크기 */
    .blk-lbl { font-size: 9px; }

    /* 일간 모드: 메모 패널 숨김 (하단 탭으로 전환) */
    .memo-panel {
      position: fixed !important;
      bottom: 0; left: 0; right: 0;
      height: 50vh;
      border-left: none;
      border-top: 1.5px solid var(--border);
      border-radius: 16px 16px 0 0;
      z-index: 500;
      display: none !important;   /* 기본: 완전히 숨김 */
      flex-direction: column;
      flex: none !important;
      width: 100% !important;
      transition: transform .25s ease;
    }
    .memo-panel.show {
      display: flex !important;   /* 열릴 때만 표시 */
    }

    /* 일간 모드: schedule wrap 전체 폭 */
    .day-layout { flex-direction: column; }
    .day-schedule-wrap { flex: 1; min-width: 0; }

    /* 모바일 메모 토글 버튼: 일간 모드에서만 JS로 표시 */
    #btnMemoToggle { display: none; }

    /* day-view 헤더 크게 */
    .dhdr { font-size: 12px; font-weight: 700; padding: 10px 4px; }

    /* modal 전체 폭 */
    .modal, .archive-panel, .wstat-panel, .tpl-panel {
      width: 100% !important;
      max-width: 100% !important;
      border-radius: 16px 16px 0 0;
      position: fixed;
      bottom: 0;
      margin: 0;
      max-height: 80vh;
    }
    .modal-overlay, .archive-overlay, .wstat-overlay, .tpl-overlay {
      align-items: flex-end;
    }

    /* 입력 필드 크게 */
    .sinp { font-size: 14px; }

    /* 줌 대신 pinch-to-zoom 허용 */
    .gscroll { touch-action: pan-y pinch-zoom; }
  }

  /* 아주 작은 화면 (max-width: 375px) */
  @media (max-width: 375px) {
    .view-btn { padding: 4px 6px; font-size: 10px; }
    .week-nav button { width: 22px; height: 22px; }
  }
</style>
</head>
<body>

<!-- 로그인 오버레이 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🗓</div>
    <div class="login-title">시간 블록 스케줄러</div>
    <div class="login-desc">Google 계정으로 로그인하면<br>모든 기기에서 스케줄이 동기화돼요</div>
    <button class="login-btn" id="googleLoginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Google로 로그인
    </button>
  </div>
</div>

<div class="topbar">
  <div class="title-row">
    <span style="font-size:20px;">🗓</span>
    <h1>시간 블록 스케줄러</h1>
    <span id="fbStatus" style="font-size:11px;color:var(--text-hint);margin-left:4px;">🔄 연결 중...</span>
    <div class="user-info" id="userInfo">
      <span class="user-name" id="userName"></span>

<script>
const PX_BASE = 10;            // px per 10-min unit (30min = 30px, 1hr = 60px)
let   PX      = PX_BASE;       // current px (mutated by zoom)
const ZOOM_STEPS = [0.5, 0.625, 0.75, 0.875, 1, 1.25, 1.5, 1.75, 2];
let   zoomIdx = 4;             // default = index 4 → 1x

function applyZoom() {
  const ratio = ZOOM_STEPS[zoomIdx];
  PX = Math.round(PX_BASE * ratio);
  document.getElementById('zoomPct').textContent = Math.round(ratio * 100) + '%';
  rebuildGridSize();
}

function rebuildGridSize() {
  const totalPx = N_SLOTS * PX;
  // update each column height + background lines
  document.querySelectorAll('.dcol').forEach(col => {
    col.style.height = (N_SLOTS * PX * 3) + 'px';
    // 5-min slots: 30-min line every 6 slots, 1-hour line every 12 slots
    col.style.backgroundImage = '';
    col.style.setProperty('--grid-overlay', `
      repeating-linear-gradient(to bottom,
        transparent 0px,                      transparent ${PX*3-1}px,
        rgba(0,0,0,.10) ${PX*3-1}px,          rgba(0,0,0,.10) ${PX*3}px,
        transparent     ${PX*3}px,            transparent     ${PX*6-1}px,
        rgba(0,0,0,.22) ${PX*6-1}px,          rgba(0,0,0,.22) ${PX*6}px)`);
  });
  // update each slot height + top
  document.querySelectorAll('.sl').forEach(sl => {
    const si = parseInt(sl.dataset.si);
    sl.style.top    = (si * PX * 3) + 'px';
    sl.style.height = (PX * 3) + 'px';
  });
  // re-render all blocks
  blocks.forEach(b => renderBlock(b));
  // update time axis label heights
  document.querySelectorAll('.tlbl').forEach(lbl => { lbl.style.height = (PX * 6) + 'px'; });
  // re-sync scroll spacer
  const hh = document.getElementById('dhdrs').getBoundingClientRect().height;
  const sp = document.getElementById('axSp'); if (sp) sp.style.height = hh + 'px';
}

const S_HR    = 5;
const E_HR    = 24;
const MIN_UNIT  = 10;                  // internal minute unit for placement
const SNAP_UNIT = 10;                  // minutes input precision
const SLOT_MIN  = 30;                  // visible slot size (minutes)
const N_SLOTS   = (E_HR - S_HR) * 2;   // 38 visible slots (30-min each)
const N_FINE    = (E_HR - S_HR) * 6;   // 114 fine slots (10-min each)
const TOTAL_MINS = (E_HR - S_HR) * 60; // 1140 min
const DAYS_EN = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const DAYS_KO = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일'];

// 카테고리: 키워드 → 색상
// 라벨에 키워드가 포함되면 해당 카테고리로 분류
const CATEGORIES = [
  { key: '업무', color: '#DC2626' },   // 빨강
  { key: '취침', color: '#7C3AED' },   // 보라
  { key: '운동', color: '#16A34A' },   // 초록
  { key: '식사', color: '#EB8E55' },   // 주황
  { key: '휴식', color: '#DB2777' },   // 핑크
  { key: '공부', color: '#059669' },   // 녹색
];
const DEFAULT_CAT   = '기타';
const DEFAULT_COLOR = '#6B7280';       // 회색
const FREE_COLOR    = '#E5E7EB';

// 라벨에서 카테고리 키 반환 ("업무 딥워크 60" → "업무")
function catOf(lbl) {
  for (const cat of CATEGORIES) if (lbl.includes(cat.key)) return cat.key;
  return DEFAULT_CAT;
}

// 카테고리 키 → 색상
function catColor(catKey) {
  const found = CATEGORIES.find(c => c.key === catKey);
  return found ? found.color : DEFAULT_COLOR;
}

// 라벨 → 색상 (블록 렌더에 사용)
function pal(lbl) { return catColor(catOf(lbl)); }
function fmtTime(mins) {
  if (mins === 0) return '0분';
  if (mins < 60) return mins + '분';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}시간 ${m}분` : `${h}시간`;
}

let blocks = [];
let activeWrap = null;
let drag = null;

const todayIdx = (() => { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; })();

/* ── Time axis ──────────────────────────────── */
function buildAxis() {
  const inner = document.getElementById('taxisInner');
  inner.innerHTML = '<div id="axSp"></div>';
  for (let h = S_HR; h <= E_HR; h++) {
    const d = document.createElement('div');
    d.className = 'tlbl';
    d.style.height = (PX * 6) + 'px';   // 6 slots × PX = 1 hour
    d.textContent = String(h).padStart(2,'0') + ':00';
    inner.appendChild(d);
  }
}

/* ── Grid ───────────────────────────────────── */
function buildGrid() {
  const hdrs = document.getElementById('dhdrs');
  hdrs.innerHTML = '';
  DAYS_EN.forEach((d, i) => {
    const btn = document.createElement('button');
    const isSat = i === 5, isSun = i === 6, isToday = i === todayIdx;
    let cls = 'dhdr';
    if (isToday) cls += ' today';
    if (isSat)   cls += ' sat';
    if (isSun)   cls += ' sun';
    btn.className = cls;
    btn.innerHTML = `<span class="day-name">${d}</span><span class="day-dot"></span>`;
    btn.title = `${DAYS_KO[i]} 통계 보기`;
    btn.addEventListener('click', () => openStats(i));
    hdrs.appendChild(btn);
  });

  const cols = document.getElementById('gcols');
  cols.innerHTML = '';

  for (let di = 0; di < 7; di++) {
    const col = document.createElement('div');
    col.className = 'dcol' + (di >= 5 ? ' weekend' : '') + (di === todayIdx ? ' today-col' : '');
    if (di === todayIdx) col.style.background = 'rgba(134,239,172,.35)';
    col.dataset.col = di;
    col.style.height = (N_SLOTS * PX * 3) + 'px';
    col.style.backgroundImage = '';
    col.style.setProperty('--grid-overlay', `
      repeating-linear-gradient(to bottom,
        transparent 0px,                      transparent ${PX*3-1}px,
        rgba(0,0,0,.10) ${PX*3-1}px,          rgba(0,0,0,.10) ${PX*3}px,
        transparent     ${PX*3}px,            transparent     ${PX*6-1}px,
        rgba(0,0,0,.22) ${PX*6-1}px,          rgba(0,0,0,.22) ${PX*6}px)`);
    for (let si = 0; si < N_SLOTS; si++) {
      const sl = document.createElement('div');
      sl.className = 'sl';
      sl.style.top    = (si * PX * 3) + 'px';  // 30분 슬롯, 10min×3
      sl.style.height = (PX * 3) + 'px';
      sl.dataset.col  = di; sl.dataset.si = si;

      const w = document.createElement('div'); w.className = 'sinp-w';
      const inp = document.createElement('input');
      inp.className = 'sinp'; inp.type = 'text'; inp.placeholder = '업무 30';
      w.appendChild(inp); sl.appendChild(w);

      // 슬롯 입력창 데이터는 컬럼 pointerup에서 처리
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')       { handleInp(inp.value, di, si); closeInp(); }
        else if (e.key === 'Escape') closeInp();
        e.stopPropagation();
      });
      inp.addEventListener('blur', () => setTimeout(closeInp, 150));
      col.appendChild(sl);
    }
    // 컬럼 레벨 드래그 생성 (빈 영역 드래그 → 시간 범위)
    attachDragCreate(col, di);
    cols.appendChild(col);
  }
}

/* ── 드래그로 블록 생성 ─────────────────────── */
let dragCreate = null;

function attachDragCreate(col, di) {
  col.addEventListener('pointerdown', e => {
    // 블록이나 입력창 위에서는 무시
    if (e.target.closest('.blk') || e.target.closest('.sinp-w')) return;
    if (drag) return;  // 블록 드래그 중이면 무시

    const rect = col.getBoundingClientRect();
    const startY = e.clientY - rect.top;
    const startFineSi = Math.floor(startY / PX);

    dragCreate = {
      col, di, startFineSi,
      curFineSi: startFineSi,
      moved: false,
      preview: null,
      pointerId: e.pointerId,
    };
    col.setPointerCapture(e.pointerId);
  });

  col.addEventListener('pointermove', e => {
    if (!dragCreate || dragCreate.col !== col) return;
    const rect = col.getBoundingClientRect();
    const curY = e.clientY - rect.top;
    const curFineSi = Math.max(0, Math.min(N_FINE, Math.round(curY / PX)));

    // 5px 이상 움직여야 드래그로 인정
    if (Math.abs((curFineSi - dragCreate.startFineSi) * PX) >= PX) {
      dragCreate.moved = true;
    }
    dragCreate.curFineSi = curFineSi;

    if (dragCreate.moved) {
      if (!dragCreate.preview) {
        const p = document.createElement('div');
        p.className = 'drag-create-preview';
        col.appendChild(p);
        dragCreate.preview = p;
      }
      const top = Math.min(dragCreate.startFineSi, curFineSi);
      const bot = Math.max(dragCreate.startFineSi, curFineSi);
      const mins = (bot - top) * MIN_UNIT;
      dragCreate.preview.style.top    = (top * PX) + 'px';
      dragCreate.preview.style.height = Math.max((bot - top) * PX, PX) + 'px';
      dragCreate.preview.textContent  = mins >= 10 ? fmtTime(mins) : '';
    }
  });

  col.addEventListener('pointerup', e => {
    if (!dragCreate || dragCreate.col !== col) return;
    const dc = dragCreate;
    dragCreate = null;
    if (dc.preview) dc.preview.remove();

    if (dc.moved) {
      // 드래그 생성: 시간 범위 결정 후 라벨 입력
      const top  = Math.min(dc.startFineSi, dc.curFineSi);
      const bot  = Math.max(dc.startFineSi, dc.curFineSi);
      const mins = Math.max((bot - top) * MIN_UNIT, 10);
      openDragCreateInput(dc.col, dc.di, top, mins);
    } else {
      // 단순 클릭: 클릭한 30분 슬롯에 입력창 열기
      if (e.target.closest('.blk')) return;
      const rect = col.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      const si30 = Math.floor(clickY / (PX * 3));  // 30분 슬롯 인덱스
      const sl = col.querySelector(`.sl[data-si="${si30}"]`);
      if (sl) {
        const w = sl.querySelector('.sinp-w');
        const inp = sl.querySelector('.sinp');
        if (w && inp) openInp(w, inp, di, si30);
      }
    }
  });

  col.addEventListener('pointercancel', () => {
    if (dragCreate && dragCreate.preview) dragCreate.preview.remove();
    dragCreate = null;
  });
}

// 드래그 생성 후 라벨 입력 받기
function openDragCreateInput(col, di, fineSi, mins) {
  closeInp();
  const wrap = document.createElement('div');
  wrap.className = 'sinp-w on';
  wrap.style.top    = (fineSi * PX) + 'px';
  wrap.style.height = Math.max(mins / MIN_UNIT * PX, PX) + 'px';
  wrap.style.left = '2px'; wrap.style.right = '2px'; wrap.style.bottom = 'auto';

  const inp = document.createElement('input');
  inp.className = 'sinp';
  inp.type = 'text';
  inp.placeholder = `라벨 입력 (${fmtTime(mins)})`;
  wrap.appendChild(inp);
  col.appendChild(wrap);
  activeWrap = wrap;
  requestAnimationFrame(() => inp.focus());

  function commit() {
    const label = inp.value.trim();
    if (label) {
      // 숫자 없이 라벨만 입력하면 드래그한 mins 사용
      const m = label.match(/^(.+?)\s+(\d+)$/);
      const finalLabel = m ? m[1].trim() : label;
      const finalMins  = m ? snap10(parseInt(m[2])) : mins;
      createBlockAt(col.dataset.col * 1, di, fineSi, finalLabel, finalMins);
    }
    wrap.remove();
    activeWrap = null;
  }
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { commit(); }
    else if (e.key === 'Escape') { wrap.remove(); activeWrap = null; }
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => setTimeout(() => { if (wrap.parentElement) commit(); }, 150));
}

// 특정 위치에 블록 생성
function createBlockAt(colIdx, di, fineSi, label, mins) {
  const slots = mins / MIN_UNIT;
  const id = Date.now() + Math.random();
  const tempB = { id, label, mins, slots, col: colIdx, si: fineSi };
  const resolvedSi = resolveSlot(tempB, colIdx, fineSi);
  const b = { id, label, mins, slots, col: colIdx, si: resolvedSi, done: false };
  blocks.push(b); renderBlock(b); updateRtLeg(); autoSave();
}

/* ── Input ──────────────────────────────────── */
function openInp(w, inp, di, si) {
  closeInp(); w.classList.add('on'); activeWrap = w;
  inp.value = ''; requestAnimationFrame(() => inp.focus());
}
function closeInp() {
  if (activeWrap) { activeWrap.classList.remove('on'); activeWrap = null; }
}
function snap10(n) { return Math.max(10, Math.round(n / 10) * 10); }

function handleInp(raw, col, si) {
  const t = raw.trim(); if (!t) return;
  const m = t.match(/^(.+?)\s+(\d+)$/);
  const label = m ? m[1].trim() : t;
  const mins  = m ? snap10(parseInt(m[2])) : 30;
  const slots = mins / MIN_UNIT;
  const id    = Date.now() + Math.random();

  // 클릭한 슬롯을 분으로 변환 (30분 단위 그리드)
  // 클릭한 30분 슬롯 → 10분 단위 fine si로 변환
  const fineSi = Math.round(si) * 3;  // 30min slot → 10min fine index
  const tempB = { id, label, mins, slots, col, si: fineSi };
  const resolvedSi = resolveSlot(tempB, col, fineSi);
  const b = { id, label, mins, slots, col, si: resolvedSi };
  blocks.push(b); renderBlock(b); updateRtLeg(); autoSave();
}

/* ── Render block ───────────────────────────── */
function renderBlock(b) {
  const col = document.querySelector(`.dcol[data-col="${b.col}"]`);
  if (!col) return;
  const old = document.getElementById('b' + b.id); if (old) old.remove();

  const el = document.createElement('div');
  el.className = 'blk' + (b.done ? ' done' : ''); el.id = 'b' + b.id;
  el.style.top    = (Math.round(b.si) * PX) + 'px';  // si = 10분 단위
  const exactH = (b.mins / MIN_UNIT) * PX - 2;       // 30분=30px, 50분=48px
  el.style.height = Math.max(exactH, 4) + 'px';
  el.style.background = pal(b.label);

  // 완료 체크 버튼
  const chk = document.createElement('button');
  chk.className = 'blk-check';
  chk.textContent = b.done ? '✓' : '';
  chk.addEventListener('pointerdown', e => {
    e.stopPropagation();
    b.done = !b.done;
    el.classList.toggle('done', b.done);
    chk.textContent = b.done ? '✓' : '';
    autoSave();
  });

  const lbl = document.createElement('div'); lbl.className = 'blk-lbl'; lbl.textContent = b.label + ' ' + b.mins + '분';
  const dur = document.createElement('div'); dur.className = 'blk-dur'; dur.style.display = 'none';
  const del = document.createElement('button'); del.className = 'blk-del'; del.textContent = '×';

  del.addEventListener('pointerdown', e => {
    e.stopPropagation(); blocks = blocks.filter(x => x.id !== b.id); el.remove(); updateRtLeg(); autoSave();
  });
  el.appendChild(chk); el.appendChild(lbl); el.appendChild(dur); el.appendChild(del);
  el.addEventListener('pointerdown', e => {
    if (e.target === del) return;
    e.preventDefault(); e.stopPropagation(); closeInp();
    const gs = document.getElementById('gscroll');
    const hdrH = document.getElementById('dhdrs').getBoundingClientRect().height;
    const blockTopInScroll = b.si * PX;  // absolute top in scroll space
    drag = {
      id: b.id, el,
      // offY = cursor position relative to block top, in scroll-space px
      offY: (e.clientY - gs.getBoundingClientRect().top - hdrH + gs.scrollTop) - blockTopInScroll,
    };
    el.classList.add('dg');
    document.getElementById('gscroll').style.overflowY = 'hidden';
  });
  col.appendChild(el);
  // if currently in day-view and this col is hidden, don't show
  if (viewMode === 'day' && b.col !== dayView) col.style.display = 'none';
}

/* ── Collision resolver (called only on drop) ── */
function resolveSlot(b, col, wantedSi) {
  // ── 완전 분(minutes) 기반 겹침 판정 ──
  // 슬롯 올림 없이 실제 mins로만 계산
  // 단, 배치는 30분 슬롯 단위(정수 si)로만 가능

  const others = blocks
    .filter(x => x.id !== b.id && x.col === col)
    .map(o => ({
      startM: Math.round(o.si) * MIN_UNIT,
      endM:   Math.round(o.si) * MIN_UNIT + o.mins   // 실제 분 끝
    }));

  const maxSi = N_FINE - Math.ceil(b.mins / MIN_UNIT);   // 10분 fine 단위
  const start = Math.max(0, Math.min(maxSi, Math.round(wantedSi)));

  // 새 블록의 실제 분 범위로 겹침 판정
  const fits = si => {
    const aS = si * MIN_UNIT;           // 시작 분
    const aE = aS + b.mins;             // 끝 분 (실제)
    return !others.some(o => aS < o.endM && aE > o.startM);
  };

  if (fits(start)) return start;

  // 가장 가까운 빈 슬롯 위아래 탐색
  let up = start - 1, down = start + 1;
  while (up >= 0 || down <= maxSi) {
    if (down <= maxSi && fits(down)) return down;
    if (up   >= 0     && fits(up))   return up;
    down++; up--;
  }
  return start;
}

/* ── Global drag: smooth free movement ───────── */
// Edge-scroll state
let edgeScrollRAF = null;

function startEdgeScroll(gs, dir) {
  if (edgeScrollRAF) return;
  function step() {
    if (!drag) { edgeScrollRAF = null; return; }
    gs.scrollTop += dir * 8;
    edgeScrollRAF = requestAnimationFrame(step);
  }
  edgeScrollRAF = requestAnimationFrame(step);
}
function stopEdgeScroll() {
  if (edgeScrollRAF) { cancelAnimationFrame(edgeScrollRAF); edgeScrollRAF = null; }
}

document.addEventListener('pointermove', e => {
  if (!drag) return;
  e.preventDefault();

  const gs    = document.getElementById('gscroll');
  const gcols = document.getElementById('gcols');
  const gr    = gs.getBoundingClientRect();
  const gcr   = gcols.getBoundingClientRect();
  const hdrH  = document.getElementById('dhdrs').getBoundingClientRect().height;

  // ── Edge-scroll zone (60px from top/bottom of grid viewport) ──
  const EDGE = 60;
  const relYInView = e.clientY - gr.top;
  if (relYInView < EDGE)                      startEdgeScroll(gs, -1);
  else if (relYInView > gr.height - EDGE)     startEdgeScroll(gs,  1);
  else                                         stopEdgeScroll();

  // ── Position: use clientY anchored at drag-start scroll offset ──
  // We captured scrollTop at drag start, so we can compute position
  // from a fixed reference that doesn't drift as scroll changes.
  const relX = e.clientX - gcr.left;
  const absY = e.clientY - gr.top - hdrH + gs.scrollTop;

  const b  = blocks.find(x => x.id === drag.id); if (!b) return;
  // 일간 모드에서는 현재 요일에 고정, 주간 모드에서만 열 이동 허용
  const nc = (viewMode === 'day') ? dayView : Math.max(0, Math.min(6, Math.floor(relX / (gcr.width / 7))));
  const ns = Math.max(0, Math.min(N_FINE - Math.ceil(b.mins / MIN_UNIT), Math.round((absY - drag.offY) / PX)));

  const tc = document.querySelector(`.dcol[data-col="${nc}"]`);
  if (tc && drag.el.parentElement !== tc) tc.appendChild(drag.el);
  drag.el.style.top = (ns * PX) + 'px';

  drag.nc = nc;
  drag.ns = ns;
}, { passive: false });

/* ── On drop: commit + resolve collisions ─────── */
function finishDrag() {
  if (!drag) return;
  stopEdgeScroll();
  const b = blocks.find(x => x.id === drag.id);
  if (b) {
    const col  = (drag.nc !== undefined) ? drag.nc : b.col;
    // si는 항상 정수 슬롯으로 보정
    const rawSi   = (drag.ns !== undefined) ? drag.ns : b.si;
    const intSi   = Math.round(rawSi);  // 10분 단위 fine si
    const resolved = resolveSlot(b, col, intSi);
    b.col = col;
    b.si  = resolved;
    drag.el.style.top = (resolved * PX) + 'px';
    const tc = document.querySelector(`.dcol[data-col="${col}"]`);
    if (tc && drag.el.parentElement !== tc) tc.appendChild(drag.el);
    autoSave();
  }
  drag.el.classList.remove('dg');
  drag = null;
  document.getElementById('gscroll').style.overflowY = 'auto';
}

document.addEventListener('pointerup',     finishDrag);
document.addEventListener('pointercancel', finishDrag);

/* ── Runtime legend ─────────────────────────── */
function updateRtLeg() {
  const seen = {};
  blocks.forEach(b => {
    const cat = catOf(b.label);
    if (!seen[cat]) seen[cat] = catColor(cat);
  });
  document.getElementById('rtLeg').innerHTML =
    Object.entries(seen).map(([cat, col]) =>
      `<div class="rt-item"><div class="rt-dot" style="background:${col}"></div>${cat}</div>`
    ).join('');
}

/* ── Stats modal ────────────────────────────── */
function openStats(dayIdx) {
  const dayBlocks = blocks.filter(b => b.col === dayIdx);

  // 카테고리 단위로 집계 ("업무 딥워크 60" + "업무 루틴 30" → 업무: 90분)
  const tally = {};
  dayBlocks.forEach(b => {
    const cat = catOf(b.label);
    tally[cat] = (tally[cat] || 0) + b.mins;
  });

  const scheduledMins = Object.values(tally).reduce((s, v) => s + v, 0);
  const freeMins      = TOTAL_MINS - scheduledMins;

  // sort by minutes desc
  const sorted = Object.entries(tally).sort((a, b) => b[1] - a[1]);

  // stacked bar segments
  const stackBar = document.createElement('div');
  stackBar.className = 'stack-bar';
  sorted.forEach(([cat, mins]) => {
    const seg = document.createElement('div');
    seg.className = 'stack-seg';
    seg.style.background = catColor(cat);
    seg.style.flex = mins;
    stackBar.appendChild(seg);
  });
  if (freeMins > 0) {
    const seg = document.createElement('div');
    seg.className = 'stack-seg';
    seg.style.background = FREE_COLOR;
    seg.style.flex = freeMins;
    stackBar.appendChild(seg);
  }

  // build modal body HTML
  const body = document.getElementById('modalBody');
  body.innerHTML = '';

  // total row
  const totalRow = document.createElement('div');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `
    <span class="total-label">총 일정 시간</span>
    <span class="total-val">${fmtTime(scheduledMins)} <span style="color:var(--text-hint);font-weight:400;font-size:11px;">/ ${fmtTime(TOTAL_MINS)}</span></span>`;
  body.appendChild(totalRow);

  // 완료율 (계획 vs 실제)
  const doneMins = dayBlocks.filter(b => b.done).reduce((s, b) => s + b.mins, 0);
  const donePct  = scheduledMins > 0 ? Math.round(doneMins / scheduledMins * 100) : 0;
  if (dayBlocks.length > 0) {
    const doneRow = document.createElement('div');
    doneRow.className = 'total-row';
    doneRow.style.marginTop = '8px';
    const barColor = donePct >= 80 ? '#16A34A' : donePct >= 50 ? '#EB8E55' : '#DC2626';
    doneRow.innerHTML = `
      <span class="total-label">✅ 완료율</span>
      <span class="total-val" style="color:${barColor}">${donePct}% <span style="color:var(--text-hint);font-weight:400;font-size:11px;">(${fmtTime(doneMins)})</span></span>`;
    body.appendChild(doneRow);
    // 완료율 진행 바
    const dbar = document.createElement('div');
    dbar.style.cssText = `height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:6px 0 14px;`;
    dbar.innerHTML = `<div style="height:100%;width:${donePct}%;background:${barColor};border-radius:3px;transition:width .4s;"></div>`;
    body.appendChild(dbar);
  }

  body.appendChild(stackBar);

  if (sorted.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:24px 0;color:var(--text-hint);font-size:13px;';
    empty.textContent = '이 날에 등록된 블록이 없습니다.';
    body.appendChild(empty);
  } else {
    const secTitle = document.createElement('div');
    secTitle.className = 'cat-section-title';
    secTitle.textContent = '카테고리별 시간';
    body.appendChild(secTitle);

    sorted.forEach(([cat, mins]) => {
      const pct = Math.round(mins / TOTAL_MINS * 100);
      const col = catColor(cat);
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `
        <div class="stat-color" style="background:${col}"></div>
        <div class="stat-name">${cat}</div>
        <div class="stat-bar-wrap">
          <div class="stat-bar-fill" style="width:${pct}%;background:${col};"></div>
        </div>
        <div class="stat-time">${fmtTime(mins)}</div>
        <div class="stat-pct">${pct}%</div>`;
      body.appendChild(row);
    });
  }

  // free time
  const freeRow = document.createElement('div');
  freeRow.className = 'free-row';
  freeRow.innerHTML = `
    <span class="free-icon">⬜</span>
    <span class="free-label">공백 시간</span>
    <span class="free-time">${fmtTime(freeMins)}</span>`;
  body.appendChild(freeRow);

  // header
  const isSat = dayIdx === 5, isSun = dayIdx === 6;
  const color = isSun ? 'var(--sun)' : isSat ? 'var(--sat)' : 'var(--text)';
  document.getElementById('modalTitle').innerHTML =
    `<span style="color:${color}">${DAYS_EN[dayIdx]}</span> &nbsp;${DAYS_KO[dayIdx]}`;
  document.getElementById('modalSub').textContent =
    `${S_HR}:00 – ${E_HR}:00 기준 (${fmtTime(TOTAL_MINS)})`;

  document.getElementById('modalOverlay').classList.add('show');
}

/* ── Weekly stats ───────────────────────────── */
function openWeekStats() {
  const DAYS_TOTAL = (E_HR - S_HR) * 60;  // mins per day
  const WEEK_TOTAL = DAYS_TOTAL * 7; // 7560

  // per-day tally (카테고리 단위)
  const dayTally = Array.from({length:7}, () => ({}));
  blocks.forEach(b => {
    const t = dayTally[b.col];
    const cat = catOf(b.label);
    t[cat] = (t[cat] || 0) + b.mins;
  });

  // total per-day scheduled
  const dayMins = dayTally.map(t => Object.values(t).reduce((s,v)=>s+v,0));

  // overall category tally (카테고리 단위)
  const catTally = {};
  blocks.forEach(b => {
    const cat = catOf(b.label);
    catTally[cat] = (catTally[cat]||0) + b.mins;
  });
  const catSorted = Object.entries(catTally).sort((a,b)=>b[1]-a[1]);
  const totalScheduled = catSorted.reduce((s,[,v])=>s+v,0);
  const activeDays = dayMins.filter(m=>m>0).length;
  const avgPerDay  = activeDays ? Math.round(totalScheduled / activeDays) : 0;

  // build body
  const body = document.getElementById('wstatBody');
  body.innerHTML = '';

  // ── summary cards ──
  const cards = document.createElement('div');
  cards.className = 'wstat-cards';
  cards.innerHTML = `
    <div class="wstat-card">
      <div class="wstat-card-label">총 일정 시간</div>
      <div class="wstat-card-val">${fmtTime(totalScheduled)}</div>
      <div class="wstat-card-sub">전체 ${fmtTime(WEEK_TOTAL)} 중</div>
    </div>
    <div class="wstat-card">
      <div class="wstat-card-label">활동 요일</div>
      <div class="wstat-card-val">${activeDays}일</div>
      <div class="wstat-card-sub">블록 있는 요일</div>
    </div>
    <div class="wstat-card">
      <div class="wstat-card-label">활동일 평균</div>
      <div class="wstat-card-val">${fmtTime(avgPerDay)}</div>
      <div class="wstat-card-sub">활동일 기준</div>
    </div>`;
  body.appendChild(cards);

  // ── weekly stacked bar ──
  if (totalScheduled > 0) {
    const bwrap = document.createElement('div'); bwrap.className = 'wstat-bar-wrap';
    const blbl  = document.createElement('div'); blbl.className = 'wstat-bar-label'; blbl.textContent = '주간 카테고리 비율';
    const stack = document.createElement('div'); stack.className = 'wstat-stack';
    catSorted.forEach(([cat, mins]) => {
      const seg = document.createElement('div'); seg.className = 'wstat-seg';
      seg.style.background = catColor(cat); seg.style.flex = mins;
      stack.appendChild(seg);
    });
    const free = document.createElement('div'); free.className = 'wstat-seg';
    free.style.background = FREE_COLOR; free.style.flex = WEEK_TOTAL - totalScheduled;
    stack.appendChild(free);
    bwrap.appendChild(blbl); bwrap.appendChild(stack);
    body.appendChild(bwrap);
  }

  // ── day-by-day breakdown ──
  const dayTitle = document.createElement('div'); dayTitle.className = 'wstat-days-title'; dayTitle.textContent = '요일별 현황';
  body.appendChild(dayTitle);

  dayMins.forEach((mins, di) => {
    const row = document.createElement('div'); row.className = 'wstat-day-row';
    const nameEl = document.createElement('div');
    nameEl.className = 'wstat-day-name' + (di===5?' sat':di===6?' sun':'');
    nameEl.textContent = DAYS_EN[di];

    const barWrap = document.createElement('div'); barWrap.className = 'wstat-day-bar-wrap';
    // segments for this day
    const dt = dayTally[di];
    Object.entries(dt).sort((a,b)=>b[1]-a[1]).forEach(([cat, m]) => {
      const seg = document.createElement('div'); seg.className = 'wstat-day-seg';
      seg.style.background = catColor(cat);
      seg.style.flex = m;
      barWrap.appendChild(seg);
    });
    if (mins < DAYS_TOTAL) {
      const free = document.createElement('div'); free.className = 'wstat-day-seg';
      free.style.background = FREE_COLOR; free.style.flex = DAYS_TOTAL - mins;
      barWrap.appendChild(free);
    }

    const timeEl = document.createElement('div'); timeEl.className = 'wstat-day-time';
    timeEl.textContent = mins > 0 ? fmtTime(mins) : '—';
    const pctEl = document.createElement('div'); pctEl.className = 'wstat-day-pct';
    pctEl.textContent = mins > 0 ? Math.round(mins/DAYS_TOTAL*100)+'%' : '';

    row.appendChild(nameEl); row.appendChild(barWrap); row.appendChild(timeEl); row.appendChild(pctEl);
    body.appendChild(row);
  });

  // ── category cards ──
  if (catSorted.length > 0) {
    const cTitle = document.createElement('div'); cTitle.className = 'wstat-days-title'; cTitle.style.marginTop='16px'; cTitle.textContent = '카테고리별 합계';
    body.appendChild(cTitle);
    const grid = document.createElement('div'); grid.className = 'wstat-cat-grid';
    catSorted.forEach(([cat, mins]) => {
      const card = document.createElement('div'); card.className = 'wstat-cat-card';
      card.innerHTML = `
        <div class="wstat-cat-dot" style="background:${catColor(cat)}"></div>
        <div class="wstat-cat-info">
          <div class="wstat-cat-name">${cat}</div>
          <div class="wstat-cat-time">${fmtTime(mins)}</div>
        </div>
        <div class="wstat-cat-pct">${Math.round(mins/WEEK_TOTAL*100)}%</div>`;
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }

  document.getElementById('wstatTitle').textContent = '📊 주간 통계';
  document.getElementById('wstatSub').textContent   = getWeekLabel(weekOffset) + ' · ' + fmtTime(totalScheduled) + ' 일정';
  document.getElementById('wstatOverlay').classList.add('show');
}

/* ── Scroll sync ────────────────────────────── */
/* ── 현재 시각 선 ────────────────────────────── */
function updateNowLine() {
  // 기존 제거
  document.querySelectorAll('.now-line, .now-label').forEach(e => e.remove());

  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  // 스케줄 범위 밖이면 표시 안 함
  if (h < S_HR || h >= E_HR) return;

  const minsFromStart = (h - S_HR) * 60 + m;
  const topPx = (minsFromStart / MIN_UNIT) * PX;

  // 오늘 요일 컬럼에만 표시
  const todayCol = document.querySelector(`.dcol[data-col="${todayIdx}"]`);
  if (!todayCol) return;

  const line = document.createElement('div');
  line.className = 'now-line';
  line.style.top = topPx + 'px';

  const label = document.createElement('div');
  label.className = 'now-label';
  label.style.top = topPx + 'px';
  label.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

  todayCol.appendChild(line);
  todayCol.appendChild(label);
}

// 1분마다 갱신
setInterval(updateNowLine, 60000);

function syncScroll() {
  const gs = document.getElementById('gscroll');
  const ti = document.getElementById('taxisInner');
  requestAnimationFrame(() => {
    const hh = document.getElementById('dhdrs').getBoundingClientRect().height;
    document.getElementById('axSp').style.height = hh + 'px';
    // 현재 시각 기준으로 스크롤 (현재 시각 - 1시간 위치)
    const now = new Date();
    const curH = now.getHours();
    const scrollH = (curH >= S_HR && curH < E_HR) ? Math.max(S_HR, curH - 1) : 7;
    gs.scrollTop = (scrollH - S_HR) * PX * 6;
  });
  gs.addEventListener('scroll', () => { ti.style.transform = `translateY(-${gs.scrollTop}px)`; });
}

function getWeekKey(offset) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2,'0');
  const d = String(monday.getDate()).padStart(2,'0');
  return `week_${y}${m}${d}`;
}

function getWeekLabel(offset) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  const rel = offset === 0 ? ' (이번 주)' : offset === -1 ? ' (지난 주)' : offset === 1 ? ' (다음 주)' : '';
  return `${monday.getFullYear()} ${fmt(monday)}–${fmt(sunday)}${rel}`;
}

/* ── Date search ─────────────────────────────── */
// weekOffset from a given Date
function offsetFromDate(date) {
  const now = new Date();
  const todayMonday = new Date(now);
  const td = now.getDay();
  todayMonday.setDate(now.getDate() - (td === 0 ? 6 : td - 1));
  todayMonday.setHours(0,0,0,0);

  const targetMonday = new Date(date);
  const dd = date.getDay();
  targetMonday.setDate(date.getDate() - (dd === 0 ? 6 : dd - 1));
  targetMonday.setHours(0,0,0,0);

  const diff = Math.round((targetMonday - todayMonday) / (7 * 86400000));
  return diff;
}

// jump to a date (week containing it, optionally switch to day-view)
function jumpToDate(dateStr) {
  if (!dateStr) return;
  const date = new Date(dateStr);
  if (isNaN(date)) { showToast('❌ 날짜 형식이 올바르지 않아요'); return; }

  const offset = offsetFromDate(date);
  weekOffset = offset;
  updateWeekTag();
  loadWeek(getWeekKey(weekOffset));

  // if day-view, also jump to the correct day-of-week
  if (viewMode === 'day') {
    const dow = date.getDay();
    const di  = dow === 0 ? 6 : dow - 1;
    setDayView(di);
  }
  showToast('📅 ' + date.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'}) + ' 주로 이동했어요');
}

/* ── Firebase 경로 헬퍼 ──────────────────────── */
const LS_PREFIX = 'scheduler_';  // localStorage 폴백용

function fbWeekPath(key) {
  const uid = currentUser ? currentUser.uid : 'local';
  return `users/${uid}/weeks/${key}`;
}
function fbMemoPath(key, di) {
  const uid = currentUser ? currentUser.uid : 'local';
  return `users/${uid}/memos/${key}/d${di}`;
}
function fbTplPath(id) { return `templates/${id}`; }
function fbTplIdxPath() { return 'tpl_index'; }

/* ── 주간 데이터 저장 ──────────────────────── */
function saveWeekData(key, data) {
  // Firebase 저장 (비동기, 연결된 경우만)
  if (db) db.ref(fbWeekPath(key)).set(data).catch(e => console.warn('FB save error', e));
  // localStorage 폴백
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(data)); return true; }
  catch(e) { return false; }
}

/* ── 주간 데이터 로드 ──────────────────────── */
async function loadWeekData(key) {
  if (db) try {
    const snap = await db.ref(fbWeekPath(key)).once('value');
    if (snap.exists()) return snap.val();
  } catch(e) { console.warn('FB load error', e); }
  // 폴백: localStorage
  try { const r = localStorage.getItem(LS_PREFIX + key); return r ? JSON.parse(r) : null; }
  catch(e) { return null; }
}

/* ── 저장된 모든 주 키 목록 ────────────────── */
async function getAllSavedKeys() {
  if (db) try {
    const snap = await db.ref('weeks').once('value');
    if (snap.exists()) {
      return Object.keys(snap.val()).sort().reverse();
    }
  } catch(e) { console.warn('FB keys error', e); }
  // 폴백: localStorage
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(LS_PREFIX)) keys.push(k.slice(LS_PREFIX.length));
  }
  return keys.sort().reverse();
}

  updateRtLeg();
  showToast(fbConnected ? '🟢 동기화 완료' : '📂 로컬에서 불러왔어요');
}

document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) { showToast('❌ 파일이 선택되지 않았어요'); return; }
  if (!file.name.endsWith('.json')) { showToast('❌ .json 파일만 불러올 수 있어요'); return; }

  const reader = new FileReader();
  reader.onerror = () => showToast('❌ 파일 읽기 실패');
  reader.onload = ev => {
    try {
      const raw = ev.target.result;
      const data = JSON.parse(raw);

      // Support both { blocks: [...] } and bare array formats
      const importedBlocks = Array.isArray(data) ? data
                           : Array.isArray(data.blocks) ? data.blocks
                           : null;
      if (!importedBlocks) throw new Error('blocks 배열을 찾을 수 없어요');

      // Clear current view
      blocks.forEach(b => { const el = document.getElementById('b' + b.id); if (el) el.remove(); });
      blocks = [];

      // Load each block — re-assign fresh id to avoid collisions
      importedBlocks.forEach(b => {
        const fresh = { ...b, id: Date.now() + Math.random() };
        blocks.push(fresh);
        renderBlock(fresh);
      });
      updateRtLeg();

      // Persist to localStorage
      const key  = (data.key)  || getWeekKey(weekOffset);
      const label = (data.label) || getWeekLabel(weekOffset);
      saveWeekData(key, { key, label, savedAt: new Date().toISOString(), blocks: blocks.map(b => ({...b})) });

      showToast(`⬆ "${label}" 불러오기 완료! (${importedBlocks.length}개 블록)`);
    } catch(err) {
      console.error('Import error:', err);
      showToast('❌ ' + (err.message || '파일을 읽을 수 없어요'));
    }
    this.value = '';  // reset input
  };
  reader.readAsText(file, 'utf-8');
});
