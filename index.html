/* ═══════════════════════════════════════════════
   TEMPLATE SYSTEM
   ═══════════════════════════════════════════════ */
const TPL_PREFIX  = 'sched_tpl_';
const TPL_IDX_KEY = 'sched_tpl_index';

function getTplIndex() {
  try { return JSON.parse(localStorage.getItem(TPL_IDX_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveTplIndex(idx) {
  if (db) db.ref(fbTplIdxPath()).set(idx).catch(e=>{});
  try { localStorage.setItem(TPL_IDX_KEY, JSON.stringify(idx)); } catch(e) {}
}
function loadTplData(id) {
  try { const r = localStorage.getItem(TPL_PREFIX + id); return r ? JSON.parse(r) : null; }
  catch(e) { return null; }
}
function saveTplData(id, data) {
  if (db) db.ref(fbTplPath(id)).set(data).catch(e=>{});
  try { localStorage.setItem(TPL_PREFIX + id, JSON.stringify(data)); } catch(e) {}
}
function deleteTpl(id) {
  if (db) db.ref(fbTplPath(id)).remove().catch(e=>{});
  try {
    localStorage.removeItem(TPL_PREFIX + id);
    const idx = getTplIndex().filter(x => x.id !== id);
    saveTplIndex(idx);
  } catch(e) {}
}

/* summary: count blocks per category */
function tplSummary(blks) {
  const tally = {};
  blks.forEach(b => {
    const cat = catOf(b.label);
    tally[cat] = (tally[cat]||0) + b.mins;
  });
  return Object.entries(tally).sort((a,b)=>b[1]-a[1]);
}

/* Save current blocks as a new template */
function saveTemplate(name) {
  if (!name.trim()) { showToast('❌ 이름을 입력해주세요'); return; }
  const id  = 'tpl_' + Date.now();
  const data = {
    id, name: name.trim(),
    savedAt: new Date().toISOString(),
    blocks: blocks.map(b => ({...b}))
  };
  saveTplData(id, data);
  const idx = getTplIndex();
  idx.push({ id, name: name.trim(), savedAt: data.savedAt, blockCount: data.blocks.length });
  saveTplIndex(idx);
  showToast('📋 템플릿 "' + name.trim() + '" 저장!');
  renderTplList();
}

/* Apply a template to current week */
// applyMode: 'replace' | 'merge'
function applyTemplate(id, applyMode) {
  const data = loadTplData(id);
  if (!data) { showToast('❌ 템플릿을 찾을 수 없어요'); return; }

  if (applyMode === 'replace') {
    blocks.forEach(b => { const el = document.getElementById('b'+b.id); if (el) el.remove(); });
    blocks = [];
  }

  data.blocks.forEach(b => {
    const fresh = { ...b, id: Date.now() + Math.random() };
    // collision resolve in same col
    fresh.si = resolveSlot(fresh, fresh.col, fresh.si);
    blocks.push(fresh);
    renderBlock(fresh);
  });
  updateRtLeg(); autoSave();
  showToast('✅ 템플릿 "' + data.name + '" ' + (applyMode==='replace'?'적용':'병합') + '!');
  document.getElementById('tplOverlay').classList.remove('show');
}

/* Rename template */
function renameTpl(id, newName) {
  const data = loadTplData(id);
  if (!data) return;
  data.name = newName.trim();
  saveTplData(id, data);
  const idx = getTplIndex().map(x => x.id === id ? {...x, name: newName.trim()} : x);
  saveTplIndex(idx);
}

/* Render template list */
function renderTplList() {
  const body = document.getElementById('tplBody');
  body.innerHTML = '';
  const idx = getTplIndex();

  if (idx.length === 0) {
    body.innerHTML = `
      <div class="tpl-empty">
        <div class="tpl-empty-icon">📋</div>
        아직 저장된 템플릿이 없어요.<br>
        현재 스케줄을 이름 붙여 저장해보세요!
      </div>`;
    return;
  }

  // per-item apply mode state
  const applyModes = {};

  idx.slice().reverse().forEach(meta => {
    applyModes[meta.id] = 'replace';
    const data = loadTplData(meta.id);
    const summary = data ? tplSummary(data.blocks) : [];
    const savedDate = new Date(meta.savedAt).toLocaleDateString('ko-KR', {month:'2-digit',day:'2-digit'});

    const item = document.createElement('div');
    item.className = 'tpl-item';
    item.dataset.id = meta.id;

    // chip HTML
    const chips = summary.slice(0,4).map(([cat,mins]) =>
      `<span class="tpl-chip" style="background:${catColor(cat)}">${cat} ${fmtTime(mins)}</span>`
    ).join('');

    item.innerHTML = `
      <div class="tpl-item-icon">📋</div>
      <div class="tpl-item-info">
        <div class="tpl-item-name">
          <span class="tpl-name-display">${meta.name}</span>
          <button class="tpl-btn" style="padding:0 6px;height:22px;font-size:10px;" data-rename="${meta.id}" title="이름 변경">✏️</button>
        </div>
        <div class="tpl-item-meta">블록 ${meta.blockCount}개 &nbsp;·&nbsp; ${savedDate} 저장</div>
        <div class="tpl-chip-row">${chips}</div>
        <div class="tpl-apply-mode" id="mode_${meta.id}">
          <button class="tpl-mode-btn sel" data-mode="replace" data-id="${meta.id}">덮어쓰기</button>
          <button class="tpl-mode-btn"     data-mode="merge"   data-id="${meta.id}">병합</button>
        </div>
      </div>
      <div class="tpl-actions">
        <button class="tpl-btn primary" data-apply="${meta.id}">적용</button>
        <button class="tpl-btn danger"  data-del="${meta.id}">삭제</button>
      </div>`;
    body.appendChild(item);
  });

  /* event delegation */
  body.addEventListener('click', e => {
    // apply
    const applyBtn = e.target.closest('[data-apply]');
    if (applyBtn) {
      const id = applyBtn.dataset.apply;
      applyTemplate(id, applyModes[id] || 'replace');
      return;
    }
    // delete
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      const id = delBtn.dataset.del;
      const meta = getTplIndex().find(x => x.id === id);
      if (meta && confirm(`"${meta.name}" 템플릿을 삭제할까요?`)) {
        deleteTpl(id); renderTplList(); showToast('🗑 삭제했어요');
      }
      return;
    }
    // mode toggle
    const modeBtn = e.target.closest('[data-mode]');
    if (modeBtn) {
      const id   = modeBtn.dataset.id;
      const mode = modeBtn.dataset.mode;
      applyModes[id] = mode;
      const row = document.getElementById('mode_' + id);
      row.querySelectorAll('.tpl-mode-btn').forEach(b => b.classList.toggle('sel', b.dataset.mode === mode));
      return;
    }
    // rename
    const renameBtn = e.target.closest('[data-rename]');
    if (renameBtn) {
      const id   = renameBtn.dataset.rename;
      const item = renameBtn.closest('.tpl-item');
      const disp = item.querySelector('.tpl-name-display');
      const oldName = disp.textContent;
      // swap to input
      const inp = document.createElement('input');
      inp.className = 'tpl-item-name-input';
      inp.value = oldName;
      disp.replaceWith(inp);
      inp.focus(); inp.select();
      const commit = () => {
        const newName = inp.value.trim() || oldName;
        renameTpl(id, newName);
        const span = document.createElement('span');
        span.className = 'tpl-name-display'; span.textContent = newName;
        inp.replaceWith(span);
        showToast('✏️ 이름 변경됨');
      };
      inp.addEventListener('blur',  commit);
      inp.addEventListener('keydown', e => { if (e.key==='Enter') inp.blur(); if (e.key==='Escape') { inp.value=oldName; inp.blur(); } });
    }
  });
}

/* ── Firebase 실시간 리스너 ───────────────────
   다른 기기에서 저장하면 현재 기기도 자동 갱신 */
let fbListenerKey = null;
let fbListenerRef = null;

function attachFirebaseListener(key) {
  if (!db) return;
  if (fbListenerRef) { fbListenerRef.off(); fbListenerRef = null; }
  fbListenerKey = key;
  fbListenerRef = db.ref(fbWeekPath(key));
  fbListenerRef.on('value', snap => {
    // 내가 방금 저장한 건 무시 (autoSave가 이미 반영함)
    if (!snap.exists()) return;
    const data = snap.val();
    if (!data || !data.blocks) return;
    // 현재 주이고 드래그 중이 아닐 때만 반영
    if (getWeekKey(weekOffset) !== key) return;
    if (drag) return;
    blocks.forEach(b => { const el = document.getElementById('b'+b.id); if (el) el.remove(); });
    blocks = [];
    data.blocks.forEach(b => { blocks.push(b); renderBlock(b); });
    updateRtLeg();
  });
}

  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'scheduler-v1';
      const ASSETS = ['/'];
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys =>
          Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
        ));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          fetch(e.request).catch(() => caches.match(e.request))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swURL).catch(() => {});
  }
